<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community-Led Open Source Adoption</title>
    <style>
        :root {
            --bg-surface: #355C4D;
            --text-primary: #FFFFFF;
            --brand: #355C4D;
            --cta: #BFA46F;
            --cta-hover: #C3B770;
            --cta-active: #A69254;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: var(--text-primary);
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
        }

        section {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        h1 {
            font-size: 2em;
            margin: 0;
        }

        h2 {
            font-size: 1.25em;
            margin: 10px 0 20px;
        }

        .benefits {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .cta-button {
            background-color: var(--cta);
            color: var(--text-primary);
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s;
            outline: none;
        }

        .cta-button:hover {
            background-color: var(--cta-hover);
        }

        .cta-button:active {
            background-color: var(--cta-active);
        }

        @media (prefers-color-scheme: dark) {
            body {
                color: var(--text-primary);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Adopt a tool you can help shape with others</h1>
    </header>
    <main>
        <section>
            <h2>Clear path for contributors and maintainers</h2>
        </section>
        <section>
            <h2>Shared ownership through open-source collaboration</h2>
        </section>
        <section>
            <h2>Wellness-oriented identity that keeps the project cohesive</h2>
        </section>
    </main>
    <footer>
        <button class="cta-button">Join the Community</button>
    </footer>
</body>
</html>
